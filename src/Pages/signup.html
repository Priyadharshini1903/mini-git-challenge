<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link rel="stylesheet" href="Signup.css" />
</head>
<body>
  <form class="fr">
    <h3>Signup</h3>
    
    <label>First Name</label>
    <input type="text" placeholder="Enter Your First Name" required  /><br />

    <label>Last Name</label>
    <input type="text" placeholder="Enter Your Last Name" required /><br />

    <label>Email</label><br>
    <input type="email" placeholder="Enter Your Emailid" required /><br />

    <label>Password</label>
    <input type="password" placeholder="Enter Your Password" required /><br />

    <label>Confirm Password</label>
    <input type="password" placeholder="Enter Your Confirm Password" required /><br />

    <button class="bn" type="submit">Submit</button>
    <p>Already have an account? <a href="Login.html">Login</a></p>
  </form>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const signupForm = document.querySelector(".fr");

      signupForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const inputs = signupForm.querySelectorAll("input");

        const firstName = inputs[0].value.trim();
        const lastName = inputs[1].value.trim();
        const email = inputs[2].value.trim();
        const password = inputs[3].value.trim();
        const confirmPassword = inputs[4].value.trim();

        if (!firstName || !lastName || !email || !password || !confirmPassword) {
          alert("Please fill in all fields.");
          return;
        }

        if (password !== confirmPassword) {
          alert("Passwords do not match.");
          return;
        }

        alert("Signup successful! Redirecting to login page...");
        window.location.href = "Login.html"; // ✅ redirect to login page
      });
    });
  </script>
</body>
</html>
